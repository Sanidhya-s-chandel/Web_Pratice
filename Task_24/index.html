<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Camera Info</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Available Cameras</h1>
        <button id="fetchDevices" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">Fetch Camera Devices</button>
        <ul id="deviceList" class="mt-4 space-y-2"></ul>
    </div>
    <script>
        async function getDeviceId() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const deviceList = document.getElementById('deviceList');
                deviceList.innerHTML = ''; // Clear the previous list

                if (videoDevices.length === 0) {
                    const noDevices = document.createElement('li');
                    noDevices.textContent = 'No video input devices found.';
                    noDevices.className = 'text-red-500';
                    deviceList.appendChild(noDevices);
                } else {
                    videoDevices.forEach((device, index) => {
                        const listItem = document.createElement('li');
                        listItem.textContent = `Camera ${index + 1}: Label: ${device.label || 'No Label'}, Device ID: ${device.deviceId || 'No Device ID'}`;
                        listItem.className = 'bg-white p-2 rounded shadow';
                        deviceList.appendChild(listItem);
                    });
                }

                console.log('Video Devices:', videoDevices);
            } catch (error) {
                console.error('Error fetching devices:', error);
                alert('Error fetching camera devices. Ensure permissions are granted.');
            }
        }

        document.getElementById('fetchDevices').addEventListener('click', getDeviceId);
    </script>
</body>
</html>
